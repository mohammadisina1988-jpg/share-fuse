name: StudioNet proofs
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: share-fuse-studionet
  cancel-in-progress: false
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned tooling
        run: |
          python -m pip install -r requirements-dev.txt
          npm install --global genlayer@0.39.2
          genvm-lint download --version v0.2.16
      - name: Lint and direct tests
        run: |
          genvm-lint check contracts/share_fuse.py --json
          python -m pytest tests/direct -q --junitxml=proofs/direct-tests.xml
          node scripts/check-proof-checker.cjs
      - name: Prepare disposable encrypted account
        run: node scripts/bootstrap-ci.cjs
      - name: Deploy and prove cumulative authorization
        run: node scripts/live-proof.cjs
      - name: Independently verify receipts and live state
        run: node scripts/verify-proofs.cjs
      - name: Upload sanitized proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studionet-proofs
          path: |
            proofs/*.json
            proofs/*.xml
          if-no-files-found: warn
